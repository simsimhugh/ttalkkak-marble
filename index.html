<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>딸깍 마블</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;600;800&family=Jua&display=swap">
<meta name="description" content="캐릭터를 골라 세계 도시를 사고 짓고 독점하는 4인 3D 보드게임. 빈 자리는 AI가 플레이합니다.">
<meta name="theme-color" content="#0b3d63">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
/* Layout: WebGL board (Three.js) in a stage with a HUD overlay; player cards + log in a side rail that stacks under the stage on phones. */
:root{
  --bg:#dfe9f3; --panel:#ffffff; --tile:#fffdf7; --ink:#15202b; --muted:#5b6a77; --line:#c6d1da;
  --hub1:#1c7fb3; --accent:#0a6a86; --accent-ink:#ffffff; --hi:#ffcf3f; --danger:#c8343c; --gold:#f7b733;
  --shadow:0 1px 0 rgba(20,40,60,.08),0 6px 20px rgba(20,40,60,.12);
  --f-display:"Black Han Sans","Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-fun:"Jua","Black Han Sans","Gothic A1",sans-serif;
  --f-body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0a1219; --panel:#15212a; --tile:#1d2b36; --ink:#e6eef3; --muted:#93a4b2; --line:#2c3d4a;
  --hub1:#135f8a; --accent:#3cb7d8; --accent-ink:#04161c; --hi:#ffcf3f; --danger:#ff6b72; --gold:#ffc84a;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.4); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0a1219; --panel:#15212a; --tile:#1d2b36; --ink:#e6eef3; --muted:#93a4b2; --line:#2c3d4a;
  --hub1:#135f8a; --accent:#3cb7d8; --accent-ink:#04161c; --hi:#ffcf3f; --danger:#ff6b72; --gold:#ffc84a;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.4); color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;background-image:radial-gradient(circle at 10% 0%,color-mix(in srgb,var(--hub1) 18%,transparent),transparent 50%),radial-gradient(circle at 95% 100%,color-mix(in srgb,var(--gold) 14%,transparent),transparent 45%)}
.app{padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));padding-block:0;max-width:none;margin:0;height:100dvh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.top h1{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0;letter-spacing:.02em;background:linear-gradient(90deg,var(--hub1),var(--accent) 60%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.top .sub{color:var(--muted);font-size:12.5px}
.top .sp{flex:1}
.btn{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 13px;border-radius:10px;cursor:pointer;transition:transform .1s,box-shadow .15s}
.btn:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow)}
.btn:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.btn.primary{background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#000));color:var(--accent-ink);border-color:transparent;text-shadow:0 1px 0 rgba(0,0,0,.15)}
.btn.gold{background:linear-gradient(180deg,#ffd868,#f0a020);color:#3a2400;border-color:transparent}
.btn.danger{background:linear-gradient(180deg,#ff6b6b,#c62828);color:#fff;border-color:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
@media (max-width:940px){.layout{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;width:100%;aspect-ratio:4/3;max-height:calc(100dvh - 80px);min-height:320px;border-radius:16px;overflow:hidden;background:#071a2a;box-shadow:0 20px 50px rgba(5,20,40,.4)}
@media (max-width:600px){.stage{aspect-ratio:1/1.15;border-radius:12px}}
.stage{--pc:#1c7fb3;box-shadow:0 20px 50px rgba(5,20,40,.4),0 0 0 3px var(--pc);transition:box-shadow .5s}
.stage canvas{display:block;width:100%!important;height:100%!important;touch-action:none}
.banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;z-index:5;display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--pc) 85%,#000) 15%,color-mix(in srgb,var(--pc) 85%,#000) 85%,transparent);color:#fff;font-family:var(--f-fun);font-size:clamp(20px,4.5vw,36px);padding:10px 60px;white-space:nowrap;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.banner .bav{width:1.5em;height:1.5em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--pc) 60%);display:grid;place-items:center;font-size:.9em;border:2px solid #fff}
.banner.show{animation:bannerIn 2.2s ease forwards}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:6}
.flash.on{animation:flashIn 1.3s ease-out forwards}
@keyframes flashIn{0%{opacity:1}30%{opacity:.9}100%{opacity:0}}
@keyframes bannerIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}20%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-60%) scale(.9)}}
.pcard.cur{animation:cardPulse 1.6s ease-in-out infinite}
@keyframes cardPulse{50%{box-shadow:0 0 0 4px var(--pc),0 8px 26px color-mix(in srgb,var(--pc) 55%,transparent)}}
#turn{background:var(--pc);box-shadow:0 0 12px var(--pc)}
.stage .loading{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:700;text-align:center;padding:20px}
.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:8px}
.hud>*{pointer-events:none}
.hud .row{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap}
.chip{pointer-events:auto;background:rgba(5,20,35,.72);color:#fff;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:700;backdrop-filter:blur(4px);display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.chip i{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pc);font-style:normal;font-size:12px;border:2px solid #fff}
.chip.btn-like{cursor:pointer;border:0;font:inherit;font-weight:700}
.hud .sp{flex:1}
.panel{pointer-events:auto;align-self:center;background:rgba(5,20,35,.72);backdrop-filter:blur(6px);color:#fff;border-radius:14px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;width:min(100%,420px);box-shadow:0 8px 30px rgba(0,0,0,.4)}
.meter{position:relative;width:100%;height:30px;display:grid;grid-template-columns:repeat(11,1fr);background:rgba(255,255,255,.08);border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,.15)}
.meter span{display:grid;place-items:center;font-weight:800;font-size:13px;color:rgba(255,255,255,.7);font-variant-numeric:tabular-nums;border-right:1px solid rgba(255,255,255,.08)}
.meter span.on{background:var(--gold);color:#3a2400}
.meter.idle span.on{background:rgba(255,255,255,.25);color:#fff}
.meter .ptr{position:absolute;top:0;bottom:0;width:3px;background:#fff;left:50%;box-shadow:0 0 8px #fff;transform:translateX(-50%)}
.meter .ptr::after{content:"";position:absolute;left:50%;top:-1px;transform:translateX(-50%);border:6px solid transparent;border-top:7px solid #fff}
.dicerow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.dice{display:flex;gap:8px}
.die{width:38px;height:38px;background:linear-gradient(145deg,#fff,#dfe6ee);border-radius:22%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:14%;box-shadow:0 3px 0 #b8c4d0,0 6px 12px rgba(0,0,0,.35)}
.die span{border-radius:50%;margin:12%}
.die span.on{background:#1b2a3a}
.die.dbl span.on{background:#d8333c}
.die.rolling{animation:shake .12s linear infinite}
@keyframes shake{25%{transform:rotate(-12deg) translateY(-4px)}75%{transform:rotate(12deg)}}
#roll,#skill{padding:8px 16px;font-size:14px}
.c-msg{font-size:13px;max-width:46ch;min-height:2.4em;text-align:center;text-wrap:balance;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.c-msg b{color:#fff!important;background:var(--pc,#333);padding:0 5px;border-radius:4px}
@media (max-width:600px){.panel{padding:6px 8px;gap:4px}.die{width:30px;height:30px}.c-msg{font-size:12px;min-height:2.2em}.meter{height:24px}.meter span{font-size:11px}#roll,#skill{padding:7px 12px;font-size:13px}}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:grid;grid-template-columns:auto 1fr auto;gap:1px 8px;align-items:center;position:relative;overflow:hidden}
.pcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--pc)}
.pcard.cur{border-color:var(--pc);box-shadow:0 0 0 2px var(--pc),0 6px 18px color-mix(in srgb,var(--pc) 35%,transparent)}
.pcard.out{opacity:.45;filter:grayscale(1)}
.pcard .av{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--pc) 60%);display:grid;place-items:center;font-size:20px;grid-row:1/3;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.pcard .pn{font-weight:800;display:flex;gap:5px;align-items:center;min-width:0;flex-wrap:wrap;font-size:13px}
.pcard .pn small{font-weight:600;font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.pcard .cash{font-family:var(--f-body);font-weight:700;font-size:19px;text-align:right;font-variant-numeric:tabular-nums}
.pcard .meta{color:var(--muted);font-size:11.5px;grid-column:2/4;display:flex;flex-wrap:wrap;gap:2px 8px}
.pcard .st{color:var(--danger);font-weight:600}
.pcard .ch{font-size:11px;color:var(--accent);font-weight:700}
.pcard .sk{font-size:10.5px;padding:0 6px;border-radius:999px;background:linear-gradient(180deg,#ffe27a,#f5b400);color:#3a2400;font-weight:800}
.pcard .sk.used{background:var(--line);color:var(--muted)}
.players{display:grid;grid-template-columns:1fr;gap:8px}
@media (max-width:940px){.players{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.pcard{padding:6px 8px}.pcard .av{width:30px;height:30px;font-size:17px}.pcard .cash{font-size:16px}.pcard .meta{display:none}}
.logbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.logbox h2,.rules summary{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:0 0 6px;font-weight:800}
#log{list-style:none;margin:0;padding:0;max-height:240px;overflow:auto;font-size:12.5px;display:flex;flex-direction:column;gap:3px}
@media (max-width:940px){#log{max-height:150px}}
#log li{border-left:3px solid var(--pc,var(--line));padding-left:7px}
.rules{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px}
.rules summary{cursor:pointer;margin:0}
.rules ul{padding-left:18px;margin:8px 0 0}
.overlay{position:fixed;inset:0;background:rgba(5,14,24,.6);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--panel);color:var(--ink);border-radius:16px;padding:18px;width:min(480px,100%);max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.card h3{font-family:var(--f-display);font-weight:400;font-size:23px;margin:0 0 8px;text-wrap:balance}
.card .body{color:var(--ink);margin-bottom:12px}
.card .body p{margin:6px 0}
.card .body .muted{color:var(--muted);font-size:13px}
.card .acts{display:flex;flex-direction:column;gap:8px}
.card .acts .btn{text-align:left;display:flex;justify-content:space-between;gap:10px;align-items:center}
.card .acts .btn b{font-variant-numeric:tabular-nums;white-space:nowrap}
.card .acts.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
.card .acts.grid .btn{justify-content:center;text-align:center}
.big-ico{font-size:50px;text-align:center;line-height:1.1;margin-bottom:6px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.setup{width:min(560px,100%)}
.setup h3{font-size:30px;background:linear-gradient(90deg,var(--hub1),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.srow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;margin-bottom:8px;background:var(--tile);border:1px solid var(--line);border-radius:12px;padding:8px}
.srow .av{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--pc) 60%);display:grid;place-items:center;font-size:22px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);cursor:pointer;grid-row:1/3}
.srow .av:focus-visible{outline:3px solid var(--hi)}
.srow input{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);min-width:0;width:100%}
.srow .chsel{grid-column:2/4;display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);min-width:0}
.srow .chsel select{font:inherit;font-size:12.5px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);min-width:0;flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{font:inherit;font-size:13px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:7px 10px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg button:focus-visible{outline:3px solid var(--hi);outline-offset:-3px}
.sopts{display:flex;flex-wrap:wrap;gap:12px 18px;margin:12px 0 16px;align-items:center}
.sopts label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.sopts select{font:inherit;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--tile);color:var(--ink)}
.lbl{font-size:12px;color:var(--muted);font-weight:600;margin:0 0 6px}
.chdesc{font-size:11.5px;color:var(--muted);grid-column:2/4;line-height:1.35}
.chdesc b{color:var(--ink)}
.toll-table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.toll-table td{padding:3px 0;border-bottom:1px solid var(--line)}
.toll-table td:last-child{text-align:right}
.rank{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.rank li{display:flex;justify-content:space-between;gap:8px;border-left:4px solid var(--pc);padding-left:8px;align-items:center}
.rank li:first-child{font-size:16px;font-weight:800}
/* chance card reveal */
.cardfx{position:absolute;inset:0;display:grid;place-items:center;z-index:8;perspective:1200px;background:radial-gradient(ellipse at center,rgba(0,0,0,.35),rgba(0,0,0,.6));cursor:pointer}
.ccard{position:relative;width:min(240px,42vw);aspect-ratio:5/7;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.8,.2,1);transform:rotateY(180deg) scale(.6);filter:drop-shadow(0 24px 40px rgba(0,0,0,.6))}
.cardfx.show .ccard{transform:rotateY(0deg) scale(1)}
.cardfx.out{animation:cardOut .45s ease forwards}
@keyframes cardOut{to{opacity:0;transform:scale(1.08)}}
.cface{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;overflow:hidden;border:4px solid #fff7e0;box-shadow:inset 0 0 0 2px rgba(0,0,0,.15)}
.cback{transform:rotateY(180deg);background:#1c2a3a;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.08) 0 10px,transparent 10px 20px),radial-gradient(circle at 50% 50%,#2d4a6a,#0b1a2a)}
.cback::after{content:"🎴";position:absolute;inset:0;display:grid;place-items:center;font-size:84px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
.cfront{display:flex;flex-direction:column;align-items:center;text-align:center;color:#15202b;background:var(--cbg,linear-gradient(160deg,#ffe29a,#ffb347))}
.cfront .cpat{position:absolute;inset:0;opacity:.22;pointer-events:none}
.cfront .cpat.rays{background:repeating-conic-gradient(from 0deg at 50% 38%,#fff 0 7deg,transparent 7deg 14deg)}
.cfront .cpat.dots{background:radial-gradient(#fff 2px,transparent 2.5px) 0 0/14px 14px}
.cfront .cpat.stripes{background:repeating-linear-gradient(-30deg,#fff 0 8px,transparent 8px 18px)}
.cfront .cpat.waves{background:repeating-radial-gradient(circle at 50% 120%,#fff 0 6px,transparent 6px 22px)}
.cfront .cpat.grid{background:linear-gradient(#fff 1px,transparent 1px) 0 0/16px 16px,linear-gradient(90deg,#fff 1px,transparent 1px) 0 0/16px 16px}
.cfront .ctitle{position:relative;margin-top:10px;font-family:var(--f-fun);font-size:clamp(17px,2.3vw,22px);background:rgba(255,255,255,.85);padding:3px 14px;border-radius:999px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.cfront .cart{position:relative;flex:1;width:100%;display:grid;place-items:center}
.cfront .cart .big{font-size:clamp(70px,11vw,110px);line-height:1;filter:drop-shadow(0 8px 10px rgba(0,0,0,.3));animation:cartPop .8s cubic-bezier(.2,1.4,.4,1) .5s both}
.cfront .cart .s1,.cfront .cart .s2{position:absolute;font-size:clamp(26px,4vw,38px);filter:drop-shadow(0 3px 4px rgba(0,0,0,.3));animation:cartFloat 2.2s ease-in-out infinite alternate}
.cfront .cart .s1{left:14%;top:14%}.cfront .cart .s2{right:14%;bottom:18%;animation-delay:-1.1s}
@keyframes cartPop{from{transform:scale(.2) rotate(-20deg);opacity:0}}
@keyframes cartFloat{to{transform:translateY(-8px) rotate(8deg)}}
.cfront .cdesc{position:relative;margin:0 10px 12px;background:rgba(255,255,255,.9);border-radius:12px;padding:8px 10px;font-size:clamp(12px,1.6vw,14px);font-weight:700;line-height:1.35}
.cfront.bad .cdesc{color:#8a1c22}
.cfront .ctag{position:absolute;top:8px;right:10px;font-size:11px;font-weight:800;background:#15202b;color:#fff;padding:1px 8px;border-radius:999px}
.cfront.bad .ctag{background:#c8343c}
.cardfx .chint{position:absolute;bottom:10%;color:#fff;font-size:13px;opacity:.8;text-shadow:0 1px 3px #000}
#modal.clear{background:rgba(5,14,24,.12);backdrop-filter:none;align-items:flex-end;padding-bottom:max(18px,env(safe-area-inset-bottom,0px))}
#modal.clear .card{width:min(420px,100%);background:rgba(255,255,255,.95)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.confetti i{position:absolute;top:-12px;width:10px;height:14px;background:var(--c);animation:fall linear forwards;border-radius:2px}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
/* toasts (event feed) */
.toasts{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:6px;min-height:0;overflow:hidden}
.toast{pointer-events:none;background:rgba(5,20,35,.82);color:#fff;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;backdrop-filter:blur(6px);box-shadow:0 6px 18px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14);animation:toastIn .35s cubic-bezier(.2,1.4,.4,1);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast b{color:#fff!important;background:none!important;padding:0!important}
.toast.money{border-color:#ffd166;background:linear-gradient(90deg,rgba(80,50,0,.9),rgba(5,20,35,.85))}
.toast.danger{border-color:#ff5a5a;background:linear-gradient(90deg,rgba(120,10,20,.92),rgba(5,20,35,.85));animation:toastIn .35s cubic-bezier(.2,1.4,.4,1),dangerPulse 1s ease-in-out 2}
.toast.good{border-color:#6ee7a0;background:linear-gradient(90deg,rgba(0,90,50,.9),rgba(5,20,35,.85))}
.toast.out{animation:toastOut .4s ease forwards}

@keyframes cardLoss{20%{background:color-mix(in srgb,#c8343c 35%,var(--panel));transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-2px)}}
.pcard.out .av::after{content:"💀";position:absolute;font-size:18px;filter:none}

/* ---- stage-first layout ---- */

.corner{width:clamp(150px,17vw,260px);flex:none;pointer-events:auto}
.corner .pcard{padding:clamp(6px,.7vw,10px) clamp(8px,.9vw,14px);grid-template-columns:auto 1fr;gap:0 clamp(6px,.7vw,10px);background:rgba(4,14,26,.86);color:#fff;border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(6px);border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.35)}

.corner .pcard .st{color:#ffb3b3}

.corner .pcard.flash-gain{animation:cardGainD .9s ease}.corner .pcard.flash-loss{animation:cardLossD .9s ease}
@keyframes cardGainD{20%{background:rgba(34,160,107,.75);transform:scale(1.04)}}
@keyframes cardLossD{20%{background:rgba(200,52,60,.8);transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-2px)}}
.panel{width:min(100%,400px);margin:0 6px}

#shop .perk.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}#shop .perk:disabled{opacity:.45;cursor:not-allowed}
.pcard.boss{background:linear-gradient(135deg,rgba(60,10,20,.92),rgba(20,4,8,.92))!important;border-color:#ffd166!important}

.chip.evchip{background:linear-gradient(90deg,#7a1fa2,#d8333c);box-shadow:0 0 12px rgba(216,51,60,.6)}
.chip.jackchip{background:linear-gradient(90deg,#8a5a00,#f5b400);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.4)}
.chip.jackchip.bump{animation:jackBump .6s ease}
@keyframes jackBump{40%{transform:scale(1.25)}}
.chip.timer{background:#1c7fb3;font-variant-numeric:tabular-nums;min-width:62px;justify-content:center}
.chip.timer.urgent{background:#c8343c;animation:lowCash .5s infinite}
.mtimer{position:absolute;right:16px;top:16px}
.card{position:relative}
.tools{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:5}
.tool{width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(5,20,35,.7);font-size:17px;cursor:pointer;display:grid;place-items:center;transition:transform .12s;padding:0;line-height:1;color:#fff}
.tool:hover{transform:scale(1.15)}.tool:focus-visible{outline:3px solid var(--hi)}.tool[aria-pressed="true"]{border-color:var(--hi);box-shadow:0 0 10px var(--hi)}
.tool.small{width:26px;height:26px;font-size:13px;display:inline-grid;vertical-align:middle;margin-left:8px}
.logpanel{position:absolute;right:52px;top:8%;bottom:8%;width:min(340px,62%);background:rgba(5,20,35,.92);color:#fff;border-radius:12px;padding:10px 12px;z-index:6;display:flex;flex-direction:column;border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(6px)}
.logpanel h2{font-size:12px;letter-spacing:.08em;color:rgba(255,255,255,.7);margin:0 0 6px;font-weight:800}
.logpanel #log{flex:1;max-height:none;color:#fff}
.logpanel #log li b{color:#fff!important}
.rules-list{padding-left:18px;margin:0;font-size:13px;line-height:1.5}
@media (max-width:700px){.corner{width:clamp(118px,30vw,150px)}.corner .pcard{padding:4px 6px}.corner .pcard .av{width:24px;height:24px;font-size:14px}.corner .pcard .cash{font-size:15px}.corner .pcard .meta{display:none}.corner .pcard .pn{font-size:11px}.corner .pcard .sk{display:none}.chip{font-size:11px;padding:3px 8px}.tools{right:4px;gap:4px}.tool{width:30px;height:30px;font-size:15px}.panel{width:min(100%,330px)}.c-msg{display:none}}
/* ---- forced landscape on portrait phones ---- */
#rot.rotated{position:fixed;top:0;left:0;width:100dvh;height:100dvw;transform:rotate(90deg) translateY(-100%);transform-origin:top left;overflow:hidden;background:var(--bg)}

</head>
<body>

<div id="rot">
<div class="app">
  <header class="top">
    <h1>딸깍 마블</h1>
    <span class="sub">캐릭터를 골라 세계 도시를 사고 짓고 독점하는 4인 3D 보드게임</span>
  </header>
  <section class="stage" id="stage">
    <div class="loading" id="loading">3D 보드를 불러오는 중…</div>
    <div class="banner" id="banner"></div>
    <div class="flash" id="flash"></div>
    <div class="vignette" id="vignette"></div>
    <div class="bigev" id="bigev"></div>
    <div class="emotes" id="emotes" hidden></div>
    <div class="cardfx" id="cardfx" hidden></div>
    <div class="tip" id="tip" hidden></div>
    <div class="tools">
      <button class="tool" id="btn-new" type="button" title="새 게임">🆕</button>
      <button class="tool" id="btn-snd" type="button" title="효과음 켜기/끄기" aria-pressed="true">🔊</button>
      <button class="tool" id="btn-bgm" type="button" title="배경음악 켜기/끄기" aria-pressed="true">🎵</button>
      <button class="tool" id="btn-cam" type="button" title="카메라: 연출 켬 — 감정·위기 때 잠깐 다가갑니다 (끄려면 클릭)">🎥</button>
      <button class="tool" id="btn-log" type="button" title="진행 기록" aria-pressed="false">📜</button>
      <button class="tool" id="btn-rules" type="button" title="규칙">❓</button>
      <button class="tool" id="btn-home" type="button" title="시점 원래대로">🏠</button>
      <button class="tool" id="btn-fs" type="button" title="전체화면">⛶</button>
    </div>
    <div class="logpanel" id="logpanel" hidden><h2>진행 기록 <button class="tool small" id="btn-log-close" type="button" title="닫기">✕</button></h2><ol id="log"></ol></div>
    <div class="hud">
      <div class="row top">
        <div class="corner" id="pc0"></div>
        <div class="mid">
          <span class="chip" id="round">1 라운드</span>
          <span class="chip" id="turn"></span>
          <span class="chip timer" id="timer" hidden>⏱ 30</span>
          <span class="chip evchip" id="evchip" hidden></span>
          <span class="chip jackchip" id="jackchip" title="세금·벌금·탈출비가 모입니다. 출발 칸에 정확히 서면 전부 가져가요.">💰 잭팟 0만</span>
        </div>
        <div class="corner" id="pc1"></div>
      </div>
      <div class="toasts" id="toasts"></div>
      <div class="row bottom">
        <div class="corner" id="pc2"></div>
        <div class="panel">
          <div class="meter idle" id="meter"><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span><span>11</span><span>12</span><i class="ptr" id="ptr"></i></div>
          <div class="mhint" id="mhint"></div>
          <div class="dicerow">
            <div class="dice"><div class="die" id="d1"></div><div class="die" id="d2"></div></div>
            <button class="btn primary" id="roll" type="button" disabled>🎲 멈춰!</button>
            <button class="btn gold" id="skill" type="button" hidden>✨ 스킬</button>
          </div>
          <div class="c-msg" id="msg">새 게임을 준비하세요.</div>
        </div>
        <div class="corner" id="pc3"></div>
      </div>
    </div>
  </section>
</div>
<template id="rules-tpl">
  <ul class="rules-list">
    <li>시작 자금 1,500만, 출발지를 지날 때마다 월급 150만. 넉넉하게 랜드마크까지 지어 보세요.</li>
    <li><b>주사위 포인터:</b> 2~12 사이를 오가는 포인터를 ‘멈춰!’로 세우면 그 숫자가 나올 확률이 크게 올라갑니다 (약 65%). 포인터 아래 글씨는 그 숫자로 가면 생기는 일입니다.</li>
    <li><b>턴 제한 시간:</b> 시간이 다 되면 주사위는 자동으로 멈추고, 선택은 ‘넘어가기’로 처리됩니다.</li>
    <li>캐릭터마다 항상 적용되는 특성과 게임 중 한 번 쓰는 스킬이 있어요. 스킬은 미리 누르는 게 아니라 <b>쓸 수 있는 상황이 오면 그 자리에서 물어봅니다</b> (통행료를 낼 때, 무인도에 갇힐 때, 건설할 때, 주사위가 나쁘게 나왔을 때).</li>
    <li>도시에 도착하면 땅을 사고 별장·빌딩·호텔을 한 번에 지을 수 있어요. 호텔이 있는 도시에 다시 오면 랜드마크를 세웁니다.</li>
    <li><b>끌어오기:</b> 내 도시(건물 있음)에 도착하면 건물 크기(별장 1 · 빌딩 2 · 호텔/랜드마크 3칸)만큼 양옆에 있는 플레이어를 끌어와 통행료를 받습니다.</li>
    <li><b>핵폭탄:</b> 출발 칸에 정확히 도착하면 건물이 있는 내 도시 하나를 골라 건물 크기만큼 양옆 칸을 폭격합니다. 남의 건물은 무너지고 건물 없는 땅은 주인을 잃어요. 폭심지와 범위 안의 <b>내 건물도 함께 무너집니다</b>(땅은 남음). 폐허에는 잔해가 남아요. 핵폭탄은 <b>1인당 1발</b>.</li>
    <li>남의 도시에서는 통행료를 내고, 랜드마크가 아니면 투자금의 1.5배로 인수할 수 있어요.</li>
    <li>같은 색 도시를 모두 가지면 통행료 2배. 축제가 열린 곳도 2배.</li>
    <li>더블이면 한 번 더. 더블 세 번이면 무인도행. 무인도는 3턴, 더블이나 100만으로 탈출.</li>
    <li>세계여행 칸에 서면 다음 턴에 원하는 칸으로 이동합니다.</li>
    <li><b>세계 이벤트:</b> 4라운드마다 올림픽(한 그룹 통행료 2배)·경기 침체(통행료 절반)·건설 붐(건설비 40% 할인)·관광 시즌(관광지 3배)·대지진·랜드마크 배당 중 하나가 터집니다.</li>
    <li><b>잭팟:</b> 세금·벌금·무인도 탈출비는 잭팟에 쌓이고, 출발 칸에 정확히 서면 전부 가져갑니다.</li>
    <li><b>유물:</b> 출발을 지날 때마다 유물 3개 중 1개를 골라 이번 판 내내 가집니다(최대 6개). 자석·흡혈·속성 공사·납 주사위·파산 보험·핵 탄두·잭팟 사냥꾼·독점 왕관·연봉 협상·할인 쿠폰.</li>
    <li><b>판마다 바뀌는 칸:</b> 행운카드 칸 2~3곳이 🎰 카지노·🔨 경매장·🕶️ 암시장으로 바뀝니다.</li>
    <li><b>🌏 세계 일주 런:</b> 아시아 → 유럽 → 아메리카 3스테이지. 사람 플레이어가 이기면 유물을 가지고 다음 스테이지로(새 유물 1개 추가). AI는 스테이지마다 자금·유물이 늘고, 마지막엔 3턴마다 땅을 강제로 사들이는 👑 재벌 회장 보스가 나옵니다.</li>
    <li><b>마일리지:</b> 판이 끝나면 순위·랜드마크·유물 수만큼 쌓이고, 시작 화면에서 시작 자금·시작 유물·핵폭탄·면제권을 삽니다.</li>

/* pick the music for the current game state */
function nearWin(p){
  let groups=0,almost=false;for(let g=0;g<8;g++){const ix=groupIdx(g);const n=ix.filter(i=>S(i).owner===p.id).length;if(n===ix.length)groups++;else if(n===ix.length-1&&ix.every(i=>S(i).owner==null||S(i).owner===p.id))almost=true;}
  if(groups>=3||(groups===2&&almost))return true;
  for(let s=0;s<4;s++){const c=sideCities(s);if(c.filter(i=>S(i).owner===p.id).length>=c.length-1)return true;}
  return tourIdx.filter(i=>S(i).owner===p.id).length>=3;
}
function updateMusic(){
  if(!G||G.over){SFX.setMood(null);return;}
  if(G.run&&RUN_STAGES[G.run.stage].boss)return SFX.setMood('boss');
  const left=G.limit?G.limit-G.round+1:99;
  if(left<=3||alive().some(nearWin))return SFX.setMood('tense');
  const hum=G.players.filter(p=>!p.ai&&!p.bankrupt),cur=G.players[G.cur];
  if(cur&&!cur.ai&&cur.island>0)return SFX.setMood('island');
  if(hum.length===1){const rank=[...alive()].sort((a,b)=>assets(b)-assets(a));if(rank.length>2&&rank[rank.length-1]===hum[0]&&hum[0].cash<400)return SFX.setMood('blue');}
  SFX.setMood('calm',G.run?[0,2,5][G.run.stage]:0);
}

  const cols=[0xff5a5a,0xffd166,0x7cf29a,0x4fc3f7,0xe040fb,0xffffff];const col=cols[Math.random()*cols.length|0];

  effects.push({t0:performance.now(),ms:700,type:'fn',fn:u=>{rocket.position.lerpVectors(pos,top,u);},done:()=>{scene.remove(rocket);rocket.geometry.dispose();rocket.material.dispose();
    const n=big?60:34,parts=[];const grp=new THREE.Group();grp.position.copy(top);scene.add(grp);const mat=new THREE.MeshBasicMaterial({color:col,transparent:true});
    for(let k=0;k<n;k++){const m=new THREE.Mesh(new THREE.SphereGeometry(.05,5,5),mat);const th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1),sp=1.6+Math.random()*1.2;m.userData.v=new THREE.Vector3(Math.sin(ph)*Math.cos(th),Math.cos(ph),Math.sin(ph)*Math.sin(th)).multiplyScalar(sp*(big?1.5:1));grp.add(m);parts.push(m);}

}
function envTick(now,dt){
  if(!env.root)return;const t=now/1000;const T=THEMES[env.theme];const R=9.4*1.5;
  env.clouds.forEach(c=>{c.position.x+=c.userData.v*dt;if(c.position.x>45)c.position.x=-45;});
  env.cars.forEach(c=>{c.userData.u+=c.userData.sp*c.userData.dir*dt*10;const p=ringPoint(c.userData.u,R,c.userData.lane);c.position.set(p.x,-0.42,p.z);c.rotation.y=p.ang+(c.userData.dir<0?Math.PI:0);});
  if(env.plane){const a=t*.18;const r=24;env.plane.position.set(Math.cos(a)*r,12+Math.sin(t*.7)*.5,Math.sin(a)*r);env.plane.rotation.y=-a;env.plane.rotation.z=.25;
    if(now-(env.lastPuff||0)>160){env.lastPuff=now;const p=new THREE.Mesh(new THREE.SphereGeometry(.14,6,6),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.55,fog:false}));p.position.copy(env.plane.position).add(new THREE.Vector3(Math.sin(a)*.7,-.05,-Math.cos(a)*.7));scene.add(p);env.trail.push({m:p,t0:now});}
    env.trail=env.trail.filter(tr=>{const u=(now-tr.t0)/3500;if(u>=1){scene.remove(tr.m);tr.m.geometry.dispose();tr.m.material.dispose();return false;}tr.m.scale.setScalar(1+u*4);tr.m.material.opacity=.5*(1-u);return true;});}
  if(env.balloon){const a=t*.045;env.balloon.position.set(Math.cos(a)*19,9+Math.sin(t*.8)*.5,-14+Math.sin(a*2)*4);}
  if(env.ferris)env.ferris.rotation.z=t*.35;
  env.blades.forEach((b,k)=>b.rotation.y=.3*Math.sin(t*3+k));
  if(env.fire){env.fire.scale.set(1+.2*Math.sin(t*17),1+.25*Math.sin(t*13+1),1+.2*Math.sin(t*19));env.fireLight.intensity=(T.night?3:1.2)*(.8+.3*Math.sin(t*21));}
  if(env.fountain){env.fountain.jets.forEach((j,k)=>{const ph=(t*1.3+k*.4)%1;j.position.set(Math.cos(j.userData.a)*ph*1.0,1.45+Math.sin(ph*Math.PI)*.9,Math.sin(j.userData.a)*ph*1.0);j.material.opacity=.8*(1-ph*.6);});}
  if(env.train)env.train.position.y=Math.sin(t*6)*.005;
  if(env.helipad)env.helipad.rotation.y=t*.4;
  env.beacons.forEach((b,k)=>b.material.emissiveIntensity=Math.sin(t*3+k)>0?3:.2);
  if(env.lake)env.lake.material.roughness=.12+.06*Math.sin(t*1.4);
  env.birds.forEach(g=>{const u=g.userData;u.a+=u.s*dt;g.position.set(Math.cos(u.a)*u.r,u.h+Math.sin(t*3+u.r)*.3,Math.sin(u.a)*u.r);g.rotation.y=-u.a;g.children[0].rotation.z=.4+Math.sin(t*9)*.5;g.children[1].rotation.z=-.4-Math.sin(t*9)*.5;});
  if(env.stars)env.stars.material.opacity=.75+.2*Math.sin(t*1.7);
  if(env.fireflies){const a=env.fireflies.geometry.attributes.position;for(let k=0;k<a.count;k++){a.setY(k,.4+Math.sin(t*1.3+k)*.5+.6);}a.needsUpdate=true;env.fireflies.material.opacity=.6+.4*Math.sin(t*5);}
  if(now>env.nextFirework){const fest=G&&!G.over&&G.festival!=null;const pos=fest&&Math.random()<.5?(()=>{const r=rect(G.festival);return new THREE.Vector3(r.x,.3,r.z);})():env.festivalPos.clone().setY(.4);firework(pos,fest);env.nextFirework=now+(fest?2500:6000)+Math.random()*3000;}
}

let camMode='follow',freeUntil=0,homePos=CAM_HOME.clone(),focusOverride=null;
const FOLLOW_OFF=new THREE.Vector3(0,5.2,5.4);
controls.addEventListener('start',()=>{freeUntil=performance.now()+7000;});
function camTick(dt){
  if(performance.now()<freeUntil&&!cinema)return;
  let tg,cp;
  let k=1-Math.pow(0.0015,dt);
  if(cinema||focusOverride){const tp=$('#tip');if(tp&&!tp.hidden)tp.hidden=true;}
  if(cinema){tg=cinema.pos.clone();cp=tg.clone().add(cinema.off);k=1-Math.pow(0.00005,dt);}
  else if(focusOverride&&performance.now()<focusOverride.until){tg=focusOverride.pt;cp=focusOverride.pt.clone().add(FOLLOW_OFF.clone().multiplyScalar(focusOverride.scale||1.3));}
  else if(false){}
  else{tg=TARGET;cp=homePos;}
  controls.target.lerp(tg,k);camera.position.lerp(cp,k);
}

const LM={stone:0xe8e2d2,glass:0x8fc7e8,gold:0xffc94a,red:0xc62d2d,copper:0x5fa58a,brick:0xa0522d,white:0xf4f4f4,dark:0x3a3f46,wood:0x8b5a2b,cream:0xf3e9d2,teal:0x3aa39a};
const LMM=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.6,...o});
function lmHelpers(g){
  const add=(m,x,y,z)=>{m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;g.add(m);return m;};
  return{
    box:(w,h,d,c,x=0,y=0,z=0,o)=>add(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),LMM(c,o)),x,y+h/2,z),
    cyl:(rt,rb,h,c,x=0,y=0,z=0,seg=16,o)=>add(new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),LMM(c,o)),x,y+h/2,z),
    cone:(r,h,c,x=0,y=0,z=0,seg=16,o)=>add(new THREE.Mesh(new THREE.ConeGeometry(r,h,seg),LMM(c,o)),x,y+h/2,z),
    dome:(r,c,x=0,y=0,z=0,o)=>add(new THREE.Mesh(new THREE.SphereGeometry(r,20,12,0,Math.PI*2,0,Math.PI/2),LMM(c,o)),x,y,z),
    sphere:(r,c,x=0,y=0,z=0,o)=>add(new THREE.Mesh(new THREE.SphereGeometry(r,14,10),LMM(c,o)),x,y,z),
    add,
  };
}
/* window-grid facade material for landmark towers */
const lmWinCache={};
function lmWin(base,lit,cols,rows,o={}){
  const key=base+lit+cols+'x'+rows;let t=lmWinCache[key];
  if(!t){const cv=document.createElement('canvas');cv.width=128;cv.height=Math.max(32,Math.round(128*rows/cols));const g=cv.getContext('2d');g.fillStyle=base;g.fillRect(0,0,cv.width,cv.height);const cw=cv.width/cols,ch=cv.height/rows;
    for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){g.fillStyle=Math.random()<.7?lit:'rgba(0,0,0,.35)';g.fillRect(x*cw+cw*.18,y*ch+ch*.2,cw*.64,ch*.55);}
    t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;lmWinCache[key]=t;}
  return new THREE.MeshStandardMaterial({color:0xffffff,map:t,emissiveMap:t,emissive:0xffffff,emissiveIntensity:o.glow??.25,roughness:o.rough??.45,metalness:o.metal??.1});
}
function lmHelpers2(g){

  return Object.assign(base,{
    mbox:(w,h,d,mat,x=0,y=0,z=0)=>add(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat),x,y+h/2,z),
    mcyl:(rt,rb,h,mat,x=0,y=0,z=0,seg=20)=>add(new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat),x,y+h/2,z),
    lathe:(pts,c,x=0,y=0,z=0,o)=>add(new THREE.Mesh(new THREE.LatheGeometry(pts.map(([a,b])=>new THREE.Vector2(a,b)),24),LMM(c,o)),x,y,z),
    torus:(r,t,c,x=0,y=0,z=0,o)=>{const m=add(new THREE.Mesh(new THREE.TorusGeometry(r,t,8,32),LMM(c,o)),x,y,z);m.rotation.x=Math.PI/2;return m;},
    arch:(w,h,d,c,x=0,y=0,z=0,o)=>{const m=add(new THREE.Mesh(new THREE.CylinderGeometry(w/2,w/2,d,16,1,false,0,Math.PI),LMM(c,o)),x,y+h,z);m.rotation.z=Math.PI/2;m.rotation.y=Math.PI/2;return m;},
    ring:(n,r,fn)=>{for(let k=0;k<n;k++){const a=k/n*Math.PI*2;fn(Math.cos(a)*r,Math.sin(a)*r,a,k);}},
  });

const MAX_RELICS=6;
const hasR=(p,id)=>!!(p&&p.relics&&p.relics.includes(id));
const nukeRange=(p,i)=>range(S(i).level)+(hasR(p,'warhead')?1:0);
function relicChoices(p,n=3){const pool=Object.keys(RELICS).filter(id=>!hasR(p,id)&&!(RELICS[id].needNuke&&G.nukesOn===false));for(let k=pool.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[pool[k],pool[j]]=[pool[j],pool[k]];}return pool.slice(0,n);}
function aiRelicScore(p,id){
  const own=owned(p),blds=own.filter(i=>T(i).type==='city'&&S(i).level>0).length;let groups=0;for(let g=0;g<8;g++)if(ownsGroup(p.id,g))groups++;
  return({magnet:blds*12,leech:blds*14+own.length*4,autobuild:p.cash>700?40:15,dice:30,insurance:p.cash<500?70:20,warhead:blds?35:5,jackhunter:(G.jackpot||0)/6+15,crown:groups?80:(own.length>4?25:5),salary:45,coupon:35})[id]+Math.random()*15;
}
function grantRelic(p,id,why){
  p.relics=p.relics||[];if(hasR(p,id))return;p.relics.push(id);const R=RELICS[id];
  if(id==='warhead'){p.nukes=(p.nukes==null?NUKES:p.nukes)+1;}
  toast(`${R.ico} ${nm(p)} 유물 획득 — <b>${R.name}</b>: ${R.desc}`,'good',4500);log(`${nm(p)} 유물 ${R.ico} ${R.name} 획득${why?' ('+why+')':''}`,p);emote(p,'happy',R.name+'!',{silent:true});SFX.play('relic');renderPlayers();
}
async function relicDraft(p,why='한 바퀴 보상'){
  if(G.over||p.bankrupt)return;p.relics=p.relics||[];if(p.relics.length>=MAX_RELICS)return;
  const ch=relicChoices(p);if(!ch.length)return;
  const pick=await decide(p,{title:`🎁 유물 고르기 · ${why}`,html:`<p>하나를 골라 이번 판 내내 가지고 갑니다. (보유 ${p.relics.length}/${MAX_RELICS})</p>`,
    options:ch.map(id=>({label:`${RELICS[id].ico} <b>${RELICS[id].name}</b> — ${RELICS[id].desc}`,value:id})).concat([{label:'건너뛰기',value:-1}])},
    ()=>ch.reduce((a,b)=>aiRelicScore(p,b)>aiRelicScore(p,a)?b:a));
  if(pick===-1||pick==null)return;grantRelic(p,pick,why);
}
/* ---- special tiles: a few chance tiles become something else each game ---- */
const SPECIALS={
  casino:{type:'casino',name:'카지노',ico:'🎰'},
  auction:{type:'auction',name:'경매장',ico:'🔨'},
  blackmarket:{type:'blackmarket',name:'암시장',ico:'🕶️'},
};
const ORIG_TILES=TILES.map(t=>t);
function rollSpecials(){
  const chanceIdx=ORIG_TILES.map((t,i)=>t.type==='chance'?i:-1).filter(i=>i>=0);
  const types=Object.keys(SPECIALS).sort(()=>Math.random()-.5);const spots=chanceIdx.sort(()=>Math.random()-.5).slice(0,2+(Math.random()<.5?1:0));
  const out={};spots.forEach((i,k)=>out[i]=types[k%types.length]);return out;
}
function applySpecials(map){
  ORIG_TILES.forEach((t,i)=>{TILES[i]=map&&map[i]?{...SPECIALS[map[i]]}:t;});
  if(typeof tiles!=='undefined'&&tiles.length)TILES.forEach((t,i)=>refreshTileLook(i));
}
function refreshTileLook(i){
  const tl=tiles[i];if(!tl||!tl.base)return;const t=T(i);const mats=tl.base.material;
  if(Array.isArray(mats)){mats[2].color.set(BASE[t.type]||0xeeeeee);[0,1,3,4,5].forEach(k=>mats[k].color.set(new THREE.Color(BASE[t.type]||0xeeeeee).multiplyScalar(.62)));}
  if(tl.prop){tl.grp.remove(tl.prop);tl.prop=null;}const pr=tileProp(t,i);if(pr){tl.grp.add(pr);tl.prop=pr;}tl.key=null;
}

function awardMiles(){
  const humans=G.players.filter(p=>!p.ai);if(!humans.length)return 0;
  const rank=[...G.players].sort((a,b)=>(a.bankrupt-b.bankrupt)||assets(b)-assets(a));

}

/* ---------- dice meter ---------- */
const meter={active:false,x:0.45,dir:1,val:7};
const meterEl=$('#meter'),ptrEl=$('#ptr'),nums=[...meterEl.querySelectorAll('span')];
function meterShow(){const v=2+Math.min(10,Math.floor(meter.x*11));if(meter.active&&v!==meter.val)SFX.play('tick');meter.val=v;ptrEl.style.left=(meter.x*100)+'%';nums.forEach((n,k)=>n.classList.toggle('on',k+2===meter.val));}
function meterTick(dt){
  if(!meter.active)return;
  meter.x+=meter.dir*dt*1.5;if(meter.x>=1){meter.x=1;meter.dir=-1;}if(meter.x<=0){meter.x=0;meter.dir=1;}
  meterShow();
}
function meterSet(v){meter.active=false;meter.x=(v-2+0.5)/11;meterShow();}
const FACES={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function face(el,n,dbl){el.innerHTML=Array.from({length:9},(_,k)=>`<span class="${FACES[n].includes(k)?'on':''}"></span>`).join('');el.classList.toggle('dbl',!!dbl);}
function aimedDice(target,rate=AIM_RATE){
  if(target!=null&&Math.random()<rate){const lo=Math.max(1,target-6),hi=Math.min(6,target-1);const a=lo+Math.floor(Math.random()*(hi-lo+1));return[a,target-a];}
  return[1+Math.random()*6|0,1+Math.random()*6|0];
}
/* returns [a,b] or null when the turn ended inside a skill */
async function roll(p,opt={}){
  let target=null;
  if(!p.ai){
    while(true){
      const btn=$('#roll');btn.disabled=false;
      meter.active=true;meterEl.classList.remove('idle');showHints(p);timerStart(G.turnSec,()=>{if(rollResolver)rollResolver('roll');});
      setMsg(`${nm(p)}, 포인터를 보고 <b style="background:#b8860b">멈춰!</b>를 누르세요. <span style="opacity:.8">(스페이스바)</span>`);
      await new Promise(r=>rollResolver=r);rollResolver=null;btn.disabled=true;
      timerStop();meter.active=false;clearHints();SFX.play('stop');
      target=meter.val;break;
    }
  }else{
    await sleep(D(450));
    target=bestDiceSum(p)??(2+Math.floor(Math.random()*11));
    meter.active=true;meterEl.classList.remove('idle');await sleep(D(500));meterSet(target);
  }
  const d1=$('#d1'),d2=$('#d2');d1.classList.add('rolling');d2.classList.add('rolling');SFX.play('dice');
  if(!p.ai)SFX.play('drum');
  for(let k=0;k<(p.ai?8:14);k++){face(d1,1+Math.random()*6|0);face(d2,1+Math.random()*6|0);await sleep(p.ai?55:45+k*6);}
  let[a,b]=aimedDice(target,Math.min(.95,(has(p,'lucky')?0.8:AIM_RATE)+(hasR(p,'dice')?.15:0)));
  if(p.fixDice){[a,b]=p.fixDice;p.fixDice=null;p.fixDiceUsed=true;}
  const fixed=!!p.fixDiceUsed;p.fixDiceUsed=false;
  d1.classList.remove('rolling');d2.classList.remove('rolling');face(d1,a,a===b);face(d2,b,a===b);if(a===b)SFX.play('dbl');
  if(target!=null&&!fixed){if(a+b===target){SFX.play('aimHit');if(!p.ai)toast(`🎯 포인터 명중! ${target}`,'good',1800);}else if(!p.ai)SFX.play('aimMiss');}
  meterEl.classList.add('idle');
  log(`${nm(p)} 🎯${target} → 주사위 ${a} + ${b} = ${a+b}${a===b?' (더블)':''}${a+b===target?' ✔':''}`,p);
  await sleep(D(250));return[a,b];
}

function modal({title,html,options,grid,timeout,noTimer,clear}){
  $('#modal').classList.toggle('clear',!!clear);
  $('#m-title').textContent=title;$('#m-body').innerHTML=html||'';
  const acts=$('#m-acts');acts.innerHTML='';acts.classList.toggle('grid',!!grid);
  return new Promise(res=>{
    modalResolver=res;const btns=[];
    options.forEach(o=>{
      const b=document.createElement('button');b.type='button';
      b.className='btn'+(o.primary?' primary':'')+(o.danger?' danger':'');b.disabled=!!o.disabled;
      b.innerHTML=`<span>${o.label}</span>${o.cost!=null?`<b>${fmt(o.cost)}</b>`:''}`;
      b.addEventListener('click',()=>{timerStop();$('#modal').hidden=true;modalResolver=null;res(o.value);});
      acts.appendChild(b);btns.push({o,b});

/* ---------- money ---------- */
function liquidate(p,need){
  const list=owned(p).sort((a,b)=>invested(a)-invested(b));
  while(p.cash<need&&list.length){
    const i=list.shift(),v=Math.round(invested(i)*0.5);
    p.cash+=v;S(i).owner=null;S(i).level=0;if(G.festival===i)G.festival=null;
    log(`${nm(p)} 자금이 부족해 ${T(i).name}을(를) ${fmt(v)}에 매각`,p);
  }
}
function pay(p,to,amt,opt={}){

async function walk(p,n){

    if(dir>0&&p.pos===0){const al=alive();const poorest=al.length>1&&al.every(q=>q===p||assets(q)>assets(p));const s=SALARY+(has(p,'explorer')?80:0)+(poorest?SALARY:0)+(hasR(p,'salary')?100:0);gain(p,s,poorest?'월급+꼴찌 구호금':'월급');if(poorest)toast(`🆘 ${nm(p)} 꼴찌 구호금! 월급 2배`,'good',3000);SFX.play('coin');log(`${nm(p)} 출발지 통과, 월급 ${fmt(s)}`,p);renderPlayers();

async function playTurn(p){
  if(p.boss&&!p.bankrupt&&!G.over){await bossAction(p);if(G.over)return;}
  if(G.event&&G.round>G.event.until){toast(`🌍 ${WEVENTS[G.event.id].name} 종료`,'info',2500);G.event=null;renderAll();}
  if(G.pendingEvent){G.pendingEvent=false;await worldEvent();if(G.over)return;}
  if(p.startDraft){p.startDraft=false;await relicDraft(p,'✈️ 시작 유물');}
  p.boost=false;renderAll();banner(p);SFX.play(p.ai?'click':'skill');updateThreats();
  if(G.limit&&G.limit-G.round===2&&!G.lateWarned){G.lateWarned=1;const lead=alive().reduce((a,b)=>assets(b)>assets(a)?b:a);toast(`⏰ 3라운드 남음! 현재 1위 ${nm(lead)} (${fmt(assets(lead))})`,'danger',6000);SFX.play('alarm');}
  await sleep(D(700));

    p.travel=false;
    const target=await pickTravel(p);
    say(`${nm(p)} 세계여행으로 ${T(target).name}(으)로 이동합니다.`,p);
    await teleport(p,target);await land(p);return;
  }
  if(p.island>0){
    const ch=await decide(p,{title:'🦜 무인도',html:`<p>남은 ${p.island}턴. 더블이 나오면 바로 탈출해요.</p>`,
      options:[{label:'주사위로 탈출 시도',value:'roll',primary:true},{label:'탈출 비용 내기',value:'pay',cost:ISLAND_FEE,disabled:p.cash<ISLAND_FEE}]},
      ()=>p.cash>700&&p.island>1?'pay':'roll');
    if(ch==='pay'){pay(p,null,ISLAND_FEE,{quiet:true,why:'탈출 비용 → 잭팟',pool:true});p.island=0;say(`${nm(p)} ${fmt(ISLAND_FEE)}을 내고 무인도를 탈출했습니다.`,p);await sailBack(p,'taxi');renderAll();}
    else{
      const d=await roll(p,{noSkill:true});if(!d)return;const[a,b]=d;
      if(a===b){p.island=0;say(`${nm(p)} 더블! 무인도를 탈출합니다.`,p);await sailBack(p,'speed');await walk(p,a+b);await land(p);return;}
      p.island--;say(`${nm(p)} 탈출 실패.${p.island?` 남은 ${p.island}턴.`:' 형기가 끝나 구조선이 옵니다.'}`,p);if(p.island===0)await sailBack(p,'rescue');return;
    }
  }
  let dbl=0;
  while(true){
    let d=await roll(p);if(!d)return;d=await luckyReroll(p,d);const[a,b]=d;
    if(a===b&&++dbl===3){say(`${nm(p)} 더블 세 번! 무인도로 직행합니다.`,p);await teleport(p,8);if(!await captainStorm(p)){jail(p);await sailToIsland(p);}return;}
    await walk(p,a+b);await land(p);

    if(a===b&&p.island===0&&!p.travel){say(`${nm(p)} 더블! 한 번 더 굴립니다.`,p);continue;}
    return;
  }
}

  else{const free=G.ts.map((s,k)=>k).filter(k=>T(k).type==='city'&&S(k).owner==null);if(!free.length)return;i=free.reduce((a,b)=>T(b).price>T(a).price?b:a);price=T(i).price;}
  if(p.cash<price+200)return;
  bigEvent(`🏢 재벌의 기업 인수!<small>${T(i).name} · ${fmt(price)}${from?' → '+esc(from.name):''}</small>`,'doom',2600);SFX.play('stamp');focusOn(i,2400,1.1);await sleep(D(1400));
  pay(p,from,price,{quiet:true,why:'기업 인수'});S(i).owner=p.id;emote(p,'cool','이것도 내 거.',{priority:6});if(from)emote(from,'angry','강제 인수라니!',{priority:6,silent:true});
  log(`🏢 ${nm(p)} 기업 인수: ${T(i).name} (${fmt(price)})${from?' ← '+nm(from):''}`,p);renderAll();checkWin(p);
}
function endGame(w,reason){
  if(G.over)return;G.over=true;G.stable=null;timerStop();SFX.setMood(null);setTimeout(updateEmoteBar,6500);
  $('#roll').disabled=true;$('#skill').hidden=true;meter.active=false;
  say(`${nm(w)} 승리! 🏆 ${reason}`,w);renderAll();confetti();SFX.play('win');bigEvent(`🏆 ${esc(w.name)} 승리!<small>${reason}</small>`,'gold',4000);
  emote(w,'laugh','내가 1등!',{priority:9,ms:6000});alive().filter(q=>q!==w).forEach(q=>emote(q,'cry','졌다…',{priority:8,ms:6000,silent:true}));
  const rank=[...G.players].sort((a,b)=>(a.bankrupt-b.bankrupt)||assets(b)-assets(a));
  if(G.run){
    const st=RUN_STAGES[G.run.stage];const humanWon=!w.ai;const last=G.run.stage===RUN_STAGES.length-1;
    if(humanWon){G.run.cleared=G.run.stage+1;}
    if(humanWon&&!last){const bonus=150*(G.run.stage+1);const m=loadMeta();m.miles+=bonus;saveMeta(m);
      setTimeout(()=>modal({title:`${st.ico} 스테이지 ${G.run.stage+1} 클리어!`,html:`<div class="big-ico">🎉</div><p><b>${esc(w.name)}</b>이(가) ${st.name} 지역을 정복했어요. ${reason}</p><p>✈️ 클리어 보너스 <b>+${bonus}</b> 마일리지</p><p class="muted">다음: ${RUN_STAGES[G.run.stage+1].ico} ${RUN_STAGES[G.run.stage+1].name} — 사람 플레이어는 유물을 가지고 가고 새 유물을 하나 더 고릅니다. AI는 자금과 유물을 더 들고 시작해요.${RUN_STAGES[G.run.stage+1].boss?' <b>👑 보스 재벌 회장이 등장합니다.</b>':''}</p>`,
        options:[{label:`${RUN_STAGES[G.run.stage+1].ico} 다음 스테이지로`,value:1,primary:true},{label:'런 포기',value:0}],noTimer:true}).then(v=>{if(v)nextStage();else showSetup();}),900);
      return;}
    const miles=awardMiles()+(humanWon?600:G.run.cleared*100);if(humanWon||G.run.cleared){const m=loadMeta();m.miles+=humanWon?600:G.run.cleared*100;saveMeta(m);}const mtot=loadMeta().miles;
    setTimeout(()=>modal({title:humanWon?'🌏 세계 일주 완주!':`💀 런 종료 — ${st.name}에서 패배`,html:`<div class="big-ico">${humanWon?'🏆':'🧳'}</div><p>${humanWon?'세 지역을 모두 정복했어요!':`${esc(w.name)}이(가) 이겼어요. ${reason}`}</p><p>클리어한 스테이지 <b>${G.run.cleared}/${RUN_STAGES.length}</b></p><p><b>✈️ 마일리지 +${miles}</b> (보유 ${mtot.toLocaleString('ko-KR')})</p>`,
      options:[{label:'새 게임',value:1,primary:true},{label:'보드 보기',value:0}],noTimer:true}).then(v=>{if(v)showSetup();}),900);
    return;
  }
  const miles=awardMiles();const mtot=loadMeta().miles;
  setTimeout(()=>modal({title:`🏆 ${w.name} 승리!`,html:`<div class="big-ico">${CH(w.ch).emoji}</div><p>${reason}</p>${miles?`<p><b>✈️ 마일리지 +${miles}</b> (보유 ${mtot.toLocaleString('ko-KR')}) — 다음 판 시작 화면에서 보너스를 사세요.</p>`:''}<ol class="rank">${rank.map((p,k)=>`<li style="--pc:${p.color}"><span>${['🥇','🥈','🥉','4위'][k]} ${CH(p.ch).emoji} ${esc(p.name)}${p.bankrupt?' (파산)':''}</span><b>${fmt(assets(p))}</b></li>`).join('')}</ol>`,
    options:[{label:'새 게임',value:1,primary:true},{label:'보드 보기',value:0}]}).then(v=>{if(v)showSetup();}),400);
}
const snap=()=>{const c={...G,players:G.players.map(p=>({...p,anim:false}))};delete c.stable;return JSON.stringify(c);};
async function loop(){
  const r=RUN;
  while(!G.over&&r===RUN){
    G.stable=snap();
    await playTurn(G.players[G.cur]);
    if(G.over||r!==RUN)break;
    renderAll();await sleep(D(400));
    if(G.over||r!==RUN)break;
    nextPlayer();
  }
}

/* ---------- setup ---------- */
const DEF_NAMES=['플레이어 1','플레이어 2','플레이어 3','플레이어 4'];
const AI_NAMES=['AI 바람','AI 파도','AI 구름','AI 노을'];
let setupCfg=[0,1,2,3].map(k=>({name:'',ai:k>=2,ch:CHARS[k].id}));
/* remember the setup screen choices in this browser */
const OPT_IDS=['opt-limit','opt-timer','opt-nuke','opt-theme','opt-speed','opt-mode'];
function saveSetup(){try{const o={};OPT_IDS.forEach(id=>{const el=$('#'+id);if(el)o[id]=el.value;});localStorage.setItem('ttm-setup',JSON.stringify({players:setupCfg,opts:o}));}catch(e){}}
function loadSetup(){try{const d=JSON.parse(localStorage.getItem('ttm-setup')||'null');if(!d)return;
  if(Array.isArray(d.players)&&d.players.length===4)setupCfg=d.players.map((c,k)=>({name:String(c.name||'').slice(0,10),ai:!!c.ai,ch:CHARS.some(x=>x.id===c.ch)?c.ch:CHARS[k].id}));
  Object.entries(d.opts||{}).forEach(([id,v])=>{const el=$('#'+id);if(el&&[...el.options].some(o=>o.value===v))el.value=v;});}catch(e){}}
function renderSetup(){
  const humans=setupCfg.filter(c=>!c.ai).length;
  $('#humans').innerHTML=[0,1,2,3,4].map(n=>`<button type="button" data-n="${n}" class="${n===humans?'on':''}">${n?n+'명':'관전'}</button>`).join('');
  $('#srows').innerHTML=setupCfg.map((c,k)=>{const ch=CH(c.ch);return `<div class="srow" style="--pc:${PCOLORS[k]}"><button type="button" class="av" data-cyc="${k}" title="캐릭터 바꾸기">${ch.emoji}</button>
    <input id="name-${k}" value="${esc(c.name)}" placeholder="${c.ai?AI_NAMES[k]:DEF_NAMES[k]}" maxlength="10" aria-label="${k+1}번 이름">
    <div class="seg"><button type="button" data-k="${k}" data-ai="0" class="${c.ai?'':'on'}">사람</button><button type="button" data-k="${k}" data-ai="1" class="${c.ai?'on':''}">AI</button></div>
    <div class="chsel"><label for="ch-${k}">캐릭터</label><select id="ch-${k}" data-ch="${k}">${CHARS.map(x=>`<option value="${x.id}" ${x.id===c.ch?'selected':''}>${x.emoji} ${x.name} · ${x.skill}</option>`).join('')}</select></div>
    <div class="chdesc"><b>특성</b> ${ch.passive} <b>스킬</b> ${ch.sdesc}</div></div>`;}).join('');
}
function readNames(){setupCfg.forEach((c,k)=>{const el=$('#name-'+k);if(el)c.name=el.value.trim();});}
$('#humans').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;readNames();const n=+b.dataset.n;setupCfg.forEach((c,k)=>c.ai=k>=n);renderSetup();renderShop();});
$('#srows').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;readNames();
  if(b.dataset.k!=null){setupCfg[+b.dataset.k].ai=b.dataset.ai==='1';renderSetup();}
  else if(b.dataset.cyc!=null){const k=+b.dataset.cyc,idx=CHARS.findIndex(x=>x.id===setupCfg[k].ch);setupCfg[k].ch=CHARS[(idx+1)%CHARS.length].id;renderSetup();}

function showSetup(){SFX.setMood(null);RUN++;timerStop();rollResolver=modalResolver=pickResolver=null;setPickable(null);meter.active=false;$('#modal').hidden=true;$('#skill').hidden=true;renderSetup();renderShop();$('#setup').hidden=false;}
$('#shop').addEventListener('click',e=>{const b=e.target.closest('button[data-perk]');if(!b||b.disabled)return;const k=b.dataset.perk;if(perkSel.has(k))perkSel.delete(k);else perkSel.add(k);renderShop();});

const newPlayer=(k,c)=>({id:k,name:c.name||(c.ai?AI_NAMES[k]:DEF_NAMES[k]),color:PCOLORS[k],ai:c.ai,ch:c.ch,cash:START_CASH,pos:0,island:0,travel:false,shield:0,bankrupt:false,skillUsed:false,boost:false,fixDice:null,anim:false,nukes:NUKES});

  G=g;applySpecials(G.specials);if(env.theme!==(G.theme||'day')){buildEnv(G.theme||'day');tiles.forEach(t=>t.key=null);}tiles.forEach(t=>{t.level=null;t.key=null;});$('#log').innerHTML='';[...G.logs].reverse().forEach(([t,pid])=>{const li=document.createElement('li');li.innerHTML=t;if(pid!=null)li.style.setProperty('--pc',G.players[pid].color);$('#log').prepend(li);});
  tiles.forEach(t=>t.key=null);buildTokens();face($('#d1'),1);face($('#d2'),1);meterSet(7);meterEl.classList.add('idle');updateEmoteBar();$('#toasts').innerHTML='';threatTiles.clear();

$('#roll').addEventListener('click',()=>{if(rollResolver)rollResolver('roll');});
{const bar=$('#emotes');bar.innerHTML=Object.entries(EMO_ICON).map(([k,v])=>`<button type="button" data-emo="${k}" title="${k}">${v}</button>`).join('');
 bar.addEventListener('click',e=>{const b=e.target.closest('button[data-emo]');if(!b||!G||G.over)return;const cur=G.players[G.cur];const me=(!cur.ai&&!cur.bankrupt)?cur:G.players.find(q=>!q.ai&&!q.bankrupt);if(!me)return;emote(me,b.dataset.emo,undefined,{priority:3});});}

{const sel=$('#opt-theme');sel.innerHTML=Object.entries(THEMES).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('');try{const t=localStorage.getItem('el-theme');if(t&&THEMES[t])sel.value=t;}catch(e){}sel.addEventListener('change',()=>{try{localStorage.setItem('el-theme',sel.value);}catch(e){}buildEnv(sel.value);});}
